# El programa de reparto en el servidor de programas (repositorio
# sistema-programas, `servidor.sh`): un contenedor por cliente.
#
# Los datos de cada cliente viven en su Google Sheet, así que no lleva base de
# datos ni copias propias: la copia es la del propio Google.
#
#   - Todo se llama con INSTANCIA (reparto-sergi-web...), para que varios
#     clientes convivan en la misma máquina.
#   - El túnel único llega por la red «publica» a http://<cliente>-web:3000.
#   - Y cada cliente tiene además su puerto propio (81NN, lo pone
#     `servidor.sh alta` según su número), solo en IP_PUERTOS (127.0.0.1 por
#     defecto; en el servidor, su IP de Tailscale).
#   - Las variables del programa (Google, DRIVERS, SESSION_SECRET...) salen del
#     .env del cliente, que es también ENV_CLIENTE.
name: ${INSTANCIA:?falta INSTANCIA}

services:
  web:
    build: .
    container_name: ${INSTANCIA}-web
    restart: always
    env_file: ${ENV_CLIENTE:?falta ENV_CLIENTE}
    mem_limit: ${LIMITE_RAM_WEB:-512m}
    ports:
      - "${IP_PUERTOS:-127.0.0.1}:${PUERTO_WEB:?falta PUERTO_WEB}:3000"
    networks: [publica]

networks:
  publica:
    external: true
